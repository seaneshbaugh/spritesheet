services:
  selenium:
    image: selenium/standalone-firefox:latest
    shm_size: 2gb
    profiles: [system-test]
    environment:
      SE_NODE_ENABLE_MANAGED_DOWNLOADS: "true"
    healthcheck:
      test: ["CMD", "/opt/bin/check-grid.sh", "--host", "0.0.0.0", "--port", "4444"]
      interval: 5s
      timeout: 5s
      retries: 12
  web:
    build: .
    volumes:
      - ".:/app"
      - "bundle:/usr/local/bundle"
    ports:
      - "3000:3000"
    init: true

volumes:
  bundle:
