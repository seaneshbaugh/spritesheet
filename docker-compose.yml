services:
  sinatra:
    build: .
    volumes:
      - ".:/app"
      - "bundle:/usr/local/bundle"
    ports:
      - "3000:3000"
    init: true
  webpack:
    build:
      context: "."
      dockerfile: "./Dockerfile.webpack"
    volumes:
      - "./assets:/assets"
      - "node_modules:/assets/node_modules"
    ports:
      - "8080:8080"
    command: "yarn run start:dev"

volumes:
  bundle:
  node_modules:
